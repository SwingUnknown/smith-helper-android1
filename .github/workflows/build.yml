          mkdir -p proj && base64 -d /tmp/proj.b64 | tar -xzf - -C proj
          chmod +x proj/gradlew
          echo "ANDROID_HOME=$ANDROID_HOME  JAVA_HOME_17=$JAVA_HOME_17_X64"
