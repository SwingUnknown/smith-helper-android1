      - name: 빌드
        shell: bash
        working-directory: proj
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          ./gradlew --no-daemon --stacktrace assembleRelease
      - name: APK 꺼내기
        shell: bash
        run: |
          cp proj/app/build/outputs/apk/release/app-release.apk SmithHelper.apk
          ls -la SmithHelper.apk
      - name: Releases 에 올리기
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" SmithHelper.apk --title "SmithHelper $TAG" --notes "폰에서 SmithHelper.apk 를 눌러 내려받아 설치하세요." --repo "${{ github.repository }}"
