      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: 빌드
        working-directory: proj
        run: gradle --no-daemon assembleRelease
      - name: APK 꺼내기
        run: cp proj/app/build/outputs/apk/release/app-release.apk SmithHelper.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SmithHelper-apk
          path: SmithHelper.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SmithHelper build ${{ github.run_number }}
          files: SmithHelper.apk
          body: "폰에서 SmithHelper.apk 를 눌러 내려받아 설치하세요."
